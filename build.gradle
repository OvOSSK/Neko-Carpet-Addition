plugins { id 'fabric-loom' version '1.5.8' }
version = '1.0.17-mc1.20.1'
group = 'neko'
base { archivesName = 'carpet-Neko-Addition' }
repositories { maven { url 'https://masa.dy.fi/maven' }; mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.20.1'
 mappings loom.officialMojangMappings()
 modImplementation 'net.fabricmc:fabric-loader:0.16.14'
 modImplementation 'carpet:fabric-carpet:1.20-1.4.112+v230608'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'
}

java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
jar { from('LICENSE') }


tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '500'] }

dependencies { testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
test { useJUnitPlatform() }

jar { from('PORT-NOTICE.txt') }

